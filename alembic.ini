[alembic]
script_location = %(here)s/backend/app/db/alembic
sqlalchemy.url = sqlite:///crew_management.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[logger_root]
level = WARNING
handlers = console
qualname = root